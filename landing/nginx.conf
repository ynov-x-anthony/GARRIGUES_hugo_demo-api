server {
    listen 8080;
    server_name _;

    # N'affiche pas la version de nginx dans les en-têtes.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/json application/javascript;
    gzip_min_length 256;

    # Point de contrôle pour le HEALTHCHECK du Dockerfile.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        # Le poster et la vidéo ne changent pas : cache modéré côté client.
        add_header Cache-Control "max-age=86400";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
