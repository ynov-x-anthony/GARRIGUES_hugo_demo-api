name: landing-docker

on:
  push:
    branches: [main, projet/docker-final]
    paths:
      - "landing/**"
      - "assets/**"
      - ".github/workflows/landing-ci.yml"
  pull_request:
    paths:
      - "landing/**"
      - "assets/**"
      - ".github/workflows/landing-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build l'image landing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: landing/Dockerfile
          push: false
          load: true
          build-args: |
            LAND_VERSION=${{ github.sha }}
          tags: landing-clouds:${{ github.sha }}

      - name: Scan Trivy (échec sur HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: landing-clouds:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library

  publish:
    needs: build-scan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: GHCR veut un nom de dépôt en minuscules
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier sur GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: landing/Dockerfile
          push: true
          build-args: |
            LAND_VERSION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}/landing-clouds:${{ github.sha }}
            ${{ env.IMAGE }}/landing-clouds:latest
